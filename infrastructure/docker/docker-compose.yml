# =============================================================================
# Job Autofill Copilot — Local Development Docker Compose
# Services: PostgreSQL, Redis, Qdrant, MinIO (S3-compatible), pgAdmin
# =============================================================================

version: "3.9"

networks:
  autofill_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  pgadmin_data:

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — primary relational database
  # Mimics Supabase's underlying Postgres in local dev
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: autofill_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autofill_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autofill_secret}
      POSTGRES_DB: ${POSTGRES_DB:-autofill_db}
      # Enable pgcrypto for UUID generation and encryption helpers
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Run init scripts on first boot (enable extensions, create roles, etc.)
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autofill_user} -d ${POSTGRES_DB:-autofill_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autofill_net

  # ---------------------------------------------------------------------------
  # Redis — cache layer + Celery broker for async task queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: autofill_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autofill_net

  # ---------------------------------------------------------------------------
  # Qdrant — vector database for RAG embeddings
  # Stores resume chunks, past answers, job descriptions, templates
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: autofill_qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-qdrant_secret}
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant/config.yaml:/qdrant/config/production.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - autofill_net

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage for encrypted resume files
  #
  # Official minio/minio and minio/mc images are blocked from free/anonymous
  # pulls on both Docker Hub and quay.io (MinIO Inc. restricted distribution
  # in 2024). Using Bitnami's community-maintained MinIO image instead, which
  # remains freely pullable and is API-compatible. It also auto-creates
  # buckets via MINIO_DEFAULT_BUCKETS, so the separate minio_init/mc service
  # (which depended on the now-blocked minio/mc image) is no longer needed.
  # ---------------------------------------------------------------------------
  minio:
    # bitnami/minio was pulled from Docker Hub entirely (Broadcom's 2024
    # catalog restructure); bitnamilegacy/minio is the frozen but still
    # publicly pullable archive of the last free Bitnami build.
    image: bitnamilegacy/minio:latest
    container_name: autofill_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-autofill_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_key}
      MINIO_DEFAULT_BUCKETS: "resumes,exports"
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - autofill_net

  # ---------------------------------------------------------------------------
  # pgAdmin — optional PostgreSQL GUI (dev convenience)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8.6
    container_name: autofill_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@autofill.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin_secret}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autofill_net

  # ---------------------------------------------------------------------------
  # Redis Commander — optional Redis GUI (dev convenience)
  # ---------------------------------------------------------------------------
  redis_commander:
    image: rediscommander/redis-commander:latest
    container_name: autofill_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:redis:6379:0:${REDIS_PASSWORD:-redis_secret}"
      HTTP_USER: ${REDIS_COMMANDER_USER:-admin}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD:-admin}
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - autofill_net